  const open = f.ideas.filter(x => x.q !== "drop"), dropped = f.ideas.length - open.length;
  let lot = `<div class="row"><input class="inp" id="fIdea" placeholder="New idea? Type it and keep going…" autocomplete="off" enterkeyhint="done"><button class="btn pri" type="button" data-fpark="1" style="min-height:44px">Park it</button></div>
    <div class="pills">${Object.entries(FAREAS).map(([k, l]) => `<button class="pill" type="button" data-farea="${k}" aria-pressed="${fArea === k}">${l}</button>`).join("")}</div>`;
  if (open.length){
    lot += `<div class="pills">${[["list","List"],["area","Map by area"],["prio","Sort by priority"]].map(([k, l]) => `<button class="pill" type="button" data-fmap="${k}" aria-pressed="${fMap === k}">${l}</button>`).join("")}</div>`;
    if (fMap === "list") lot += open.slice(0, 40).map(x => `<div style="border-top:1px solid var(--bdr);padding-top:8px;display:flex;flex-direction:column;gap:6px"><div class="ctitle">${esc(x.t)}</div>
      <div class="sets"><span class="chip">${FAREAS[x.a] || ""}</span>${FQUAD.map(([k, l]) => `<button class="set ${x.q === k ? "done" : ""}" type="button" data-fq="${x.id}:${k}">${l}</button>`).join("")}<button class="set" type="button" data-fidtop="${x.id}">→ Top 3</button><button class="set add" type="button" data-fiddel="${x.id}" aria-label="Delete idea">✕</button></div></div>`).join("");
    else { const cols = fMap === "area" ? Object.entries(FAREAS) : FQUAD; lot += `<div class="fmap">` + cols.map(([k, l]) => { const it = open.filter(x => (fMap === "area" ? x.a : (x.q || "plan")) === k); if (fMap === "area" && !it.length) return ""; return `<div class="box"><b>${esc(l)} · ${it.length}</b>${it.slice(0, 8).map(x => `<div>${esc(x.t)}</div>`).join("")}</div>`; }).join("") + `</div>`; if (fMap === "prio") lot += `<div class="note">Untagged ideas sit in Schedule. Tag them in List view.</div>`; }
    lot += `<button class="btn wide" type="button" data-title="Help me prioritise" data-ask="${esc("Here is my idea parking lot. Act as a sharp, kind productivity coach. Pick the 3 that matter most this week and say why in one line each, suggest which to hand off or drop, and give me the first 15-minute step for my #1. My ideas:\n" + open.map(x => "- [" + (FAREAS[x.a] || "").replace(/^\S+\s/, "") + "] " + x.t).join("\n"))}">🧠 Help me prioritise</button>`;
    if (dropped) lot += `<button class="btn del" type="button" data-fclear="1">Clear ${dropped} dropped</button>`;
    if ([5, 0].includes(new Date().getDay())) lot += `<div class="status">Weekly review: keep 3 ideas, schedule them, drop the rest without guilt.</div>`;
  }
  h += sec("💡 Idea parking lot", card(lot), `<span class="count num">${open.length}</span>`);
  // Tip
  h += sec("✨ Focus tip of the day", card(`<div class="ctitle">${esc(FTIPS[Math.floor(Date.now() / 864e5) % FTIPS.length])}</div>`));
  // Anchors
  const L = FCHK(), done = L.filter(([k]) => d.chk[k]).length;
  const bars = Array.from({ length:7 }, (_, j) => { const i = 6 - j, o = fPeek(-i), s = o ? (o.score || 0) : 0; return `<div><i style="height:${Math.max(3, s * 0.4)}px;opacity:${i ? .5 : 1}"></i>${new Date(Date.now() - i * 864e5).toLocaleDateString("en-CA", { weekday:"narrow" })}</div>`; }).join("");
  const adh = w => `<details class="fold"><summary>${w === "morning" ? "أذكار الصباح · Morning adhkar" : "أذكار المساء · Evening adhkar"}</summary>${ADHKAR[w].map(([a, e, c]) => `<div style="border-top:1px dashed var(--bdr);padding:6px 0"><div class="ar">${esc(a)}</div><div class="note">${esc(e)} · ×${c}</div></div>`).join("")}</details>`;
  h += sec("🕋 Daily anchors · faith + body", card(`<div>${L.map(([k, l]) => `<button class="fchk ${d.chk[k] ? "dn" : ""}" type="button" data-fchk="${k}"><span class="check ${d.chk[k] ? "done" : ""}" aria-hidden="true">${d.chk[k] ? "✓" : ""}</span><span>${esc(l)}</span></button>`).join("")}</div>${adh("morning")}${adh("evening")}<div class="sec-lbl">Last 7 days</div><div class="fscore num">${bars}</div>`), `<span class="count num">${done}/${L.length} · ${Math.round(done * 100 / L.length)}%</span>`);
  // Body
  const today = new Date().toLocaleDateString("en-CA", { weekday:"short" }).slice(0, 3), PD = PLAN && PLAN.days ? PLAN.days.find(x => x.day === today) : null, tg = PD && PLAN.targets ? (PLAN.targets[PD.type] || PLAN.targets.training) : null;
  h += sec("🥗 Fat-loss rhythm · 2 meals + 1 snack", card(`${tg ? `<div class="meta num"><span class="chip c-red">🔥 ${tg.kcal} kcal</span><span class="chip c-acc">💪 ${tg.protein}g protein</span><span class="chip ${PD.type === "training" ? "c-grn" : "c-pur"}">${PD.type === "training" ? "Training day" : "Rest day"}</span></div>` : ""}
    <div class="note"><b>Meal 1</b> after the gym, 8–9 a.m.: eggs, ful or Greek yogurt with oats.</div>
    <div class="note"><b>Snack</b> 3–4 p.m.: Greek yogurt, tuna, boiled eggs or labneh, plus fruit or a few nuts.</div>
    <div class="note"><b>Meal 2</b> around Maghrib: half the plate vegetables, a palm of protein, a fist of carbs${fGym() ? "" : " (or skip the carbs on rest days)"}.</div>
    <div class="note"><b>After Isha</b>: kitchen closed. Protein at every meal, whole foods, no whey, 7+ hours of sleep.</div>
    <button class="btn wide" type="button" data-gofit="1">Open my week plan →</button>`));
  // Shutdown
  h += sec("🌙 Evening shutdown · 2 minutes", card(["What went well today?", "What drained my energy?", "Tomorrow's #1 is…"].map((q, i) => `<input class="inp" data-frv="${i}" value="${esc(d.rv[i] || "")}" placeholder="${esc(q)}" autocomplete="off">`).join("") + `<div class="note">Tomorrow's #1 goes straight into tomorrow's Top 3.</div>`));
  // Settings
  h += `<details class="card" style="display:block"><summary class="cbody" style="cursor:pointer;font-weight:700">⚙️ Settings · gym days and Quran target</summary><div class="cbody" style="padding-top:0">
    <div class="sec-lbl">Gym days</div><div class="fdays">${["S","M","T","W","T","F","S"].map((x, i) => `<button class="pill" type="button" data-fgym="${i}" aria-pressed="${f.gymDays.includes(i)}" style="padding:6px 0">${x}</button>`).join("")}</div>
    <div class="sec-lbl" style="margin-top:6px">Quran per day</div><div class="acts" style="align-items:center"><button class="btn" type="button" data-fwird="-1" aria-label="Fewer pages">−</button><span class="num" style="font-weight:700">${f.wird} pages</span><button class="btn" type="button" data-fwird="1" aria-label="More pages">+</button><span class="note">about ${Math.ceil(604 / f.wird / 30)} months per khatma</span></div>
    <div class="note">Private: saved only in your Life OS, never on Signal Desk.</div></div></details>`;
  return h;
}
function fTick(){
  const f = S.focus, el = document.getElementById("fClock"); if (!f || !f.sprint) return;
  const left = Math.round((f.sprint.end - Date.now()) / 1000);
  if (left <= 0){ f.sprint = null; save(); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch(_) {} toast("Sprint done. 5-minute reset: stand, water, walk or wudu."); if (cNav === "focus") render(); return; }
  if (el) el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
}
setInterval(fTick, 1000);
function fPark(){ const i = document.getElementById("fIdea"); const v = i && i.value.trim(); if (!v) return i && i.focus(); F().ideas.unshift({ id:Date.now(), t:v, a:fArea, q:"" }); F().ideas = F().ideas.slice(0, 200); save(); toast("Parked. Back to your task."); render(); }
async function fBook(btn){
  if (!mcp) return toast("Calendar needs the Claude app or claude.ai", false);
  const B = fBlocks(), d = fDay(0), now = Math.ceil((nowMin() + 1) / 5) * 5, busy = calMins();
  const plan = [];
  if (fGym() && !d.booked.gym && !busy.some(e => /gym|workout|train/i.test(e.t))) plan.push(["gym", B.g0, B.g0 + 60, "🏋️ Gym", "health", "Gym, then a high-protein breakfast."]);
  let s = B.g1;
  [0, 1].forEach(i => { if (d.top[i] && !d.booked["t" + i]){ const e = Math.min(s + 90, B.t.Dhuhr - 10); if (e - s >= 30) plan.push(["t" + i, s, e, "🎯 " + d.top[i], "career", "Deep work. Phone in another room. Park new ideas."]); s = e + 10; } });
  if (d.top[2] && !d.booked.t2) plan.push(["t2", B.t.Asr + 15, Math.min(B.t.Asr + 75, B.t.Maghrib - 10), "🎯 " + d.top[2], "career", "Finish strong. Park new ideas."]);
  const todo = plan.map(p => { const q = p.slice(); q[1] = Math.max(q[1], now); return q; }).filter(p => p[2] - p[1] >= 20 && !busy.some(e => e.s < p[2] && e.e > p[1]));
  if (!plan.length) return toast(d.top.some(Boolean) ? "Already booked for today" : "Add your Top 3 first", false);
  if (!todo.length) return toast("Those times are already busy or past", false);
  btn.disabled = true; btn.textContent = "Booking…"; let ok = 0;
  for (const [k, a, b, title, cat, note] of todo){
    try { await mcp.callTool("Google Calendar", "create_event", { summary:title, startTime:isoAt(a), endTime:isoAt(b), description:"Life OS · Focus\n" + note, colorId:CAL_COLOR[cat] || "9", timeZone:"America/Toronto" }); d.booked[k] = true; ok++; }
    catch(e){ toast(errText("Google Calendar", e), false); break; }
    await new Promise(r => setTimeout(r, 350));
  }
  save(); if (ok) toast(`Booked ${ok} block${ok > 1 ? "s" : ""} in Google Calendar${plan.length > ok ? " · busy or past times skipped" : ""}`);
  btn.disabled = false; btn.textContent = "📅 Book my focus blocks in Google Calendar"; loadCal();
}

/* ---------- watch and listen: private to you, saved with your Life OS state ---------- */
let wRecs = null, wBusy = false;
function renderWatch(){
  const list = S.watch || [];
  const rows = list.length
    ? list.map(x => `<div class="card"><div class="cbody"><div class="ctop"><div class="ctitle">${esc(x.title)}</div><span class="chip num ${x.type === "Movie" ? "c-pur" : "c-acc"}">${x.type === "Movie" ? "🎬" : "📺"} ${esc(x.type)}${x.year ? " · " + esc(x.year) : ""}</span></div><div class="acts"><button class="btn del" type="button" data-wdel="${x.id}">Remove</button></div></div></div>`).join("")
    : `<div class="empty">Add a series or movie you like. Your list is private to you.</div>`;
  const recs = wBusy ? `<div class="empty">Claude is finding matches…</div>`
    : wRecs && wRecs.length ? wRecs.map(x => `<div class="card"><div class="stripe" style="background:var(--pur)"></div><div class="cbody"><div class="ctop"><div class="ctitle">${esc(x.title)}</div><span class="chip num c-pur">${esc(x.type || "")}${x.year ? " · " + esc(x.year) : ""}</span></div>${x.reason ? `<div class="note">${esc(x.reason)}</div>` : ""}</div></div>`).join("")
    : wRecs ? `<div class="empty">No matches yet. Try adding a few more titles.</div>`
    : `<div class="status">Tap the button to get suggestions based on your list.</div>`;
  return `<section class="sec"><div class="sec-hd"><span class="sec-lbl">🎬 Add a series or movie</span><span class="count num">${list.length}</span></div>
    <form class="card" id="wForm" style="display:block"><div class="cbody" style="gap:9px">
      <input class="inp" id="wTitle" placeholder="e.g. Severance" maxlength="80" autocomplete="off" required>
      <div class="two"><input class="inp" id="wYear" placeholder="Year (optional)" maxlength="4" inputmode="numeric" autocomplete="off"><select class="inp" id="wType"><option>Series</option><option>Movie</option></select></div>
      <button class="btn pri wide" type="submit">Add to my list</button>
    </div></form></section>
    <section class="sec"><div class="sec-hd"><span class="sec-lbl">📺 Your favourites</span></div>${rows}</section>
    <section class="sec"><div class="sec-hd"><span class="sec-lbl">✨ Recommended for you</span></div>
      <button class="btn wide" type="button" data-wrec="1"${wBusy ? " disabled" : ""}>Get recommendations</button>${recs}
      <div class="note">Suggestions come from Claude, based on your list. Streaming availability is not checked.</div></section>`;
}
function addWatch(){
  const title = $("#wTitle").value.trim(), y = $("#wYear").value.trim();
  if (!title) return $("#wTitle").focus();
  S.watch = [...(S.watch || []), { id: Date.now(), title, type: $("#wType").value, year: /^\d{4}$/.test(y) ? y : "" }];
  wRecs = null; save();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  toast("Added to your list"); render();
}
function delWatch(id){ S.watch = (S.watch || []).filter(x => x.id !== id); save(); render(); }
async function getWatchRecs(){
  const list = S.watch || [];
  if (!list.length) return toast("Add a series or movie first", false);
  const sample = await use("sample");
  if (!sample) return toast("Recommendations need the Claude app or claude.ai", false);
  wBusy = true; render();
  const liked = list.map(x => x.title + " (" + x.type + (x.year ? ", " + x.year : "") + ")").join("; ");
  const prompt = "The viewer likes these: " + liked + ". Suggest 6 series or movies they may enjoy, similar in tone, genre and pacing, and not already in that list. Return only a JSON array. Each item has title, type (Series or Movie), year and reason (one short sentence on why it matches). Do not mention where to stream.";
  try {
    const res = await sample(prompt);
    const txt = String(res && res.text || "");
    const arr = JSON.parse(txt.slice(txt.indexOf("["), txt.lastIndexOf("]") + 1));
    wRecs = arr.filter(x => x && typeof x.title === "string").slice(0, 6);
  } catch(_){ wRecs = []; toast("Could not get recommendations. Try again.", false); }
  wBusy = false; render();
}

/* ---------- master render ---------- */
function updateBadge(){ const t = S.tasks.filter(x => x.date === localDay()), d = t.filter(x => x.done).length; $("#badge").textContent = t.length ? `${d}/${t.length} · ${Math.round(d / t.length * 100)}%` : calEvs && calEvs.length ? `📅 ${calEvs.length} event${calEvs.length > 1 ? "s" : ""}` : "Clear day"; }
function render(){
  if (!stateReady) return;
  const ae = document.activeElement;
  if ((cNav === "focus" || cNav === "watch") && ae && ae.matches && ae.matches("#main input") && ae.value){ fPending = true; return; }
  fPending = false;
  let h = "";
  if (cNav === "focus") h = renderFocus();
  else if (cNav === "brief"){
    if (cTab !== "business") h += `<section class="sec"><div class="sec-hd"><span class="sec-lbl">🗓️ Today's schedule</span><button class="iconbtn" type="button" data-reload="cal" aria-label="Reload calendar">↻</button></div>${renderCal()}</section>`;
    h += `<section class="sec"><div class="sec-hd"><span class="sec-lbl">⚡ Priority tasks</span><span class="count num">${S.tasks.filter(t => t.date === localDay()).length}</span></div>${renderTasks()}</section>`;
    if (cTab !== "personal") h += `<section class="sec"><div class="sec-hd"><span class="sec-lbl">🎯 Pipeline snapshot</span><button class="iconbtn" type="button" data-reload="deals" aria-label="Reload pipeline">↻</button></div>${renderPipeline(true)}</section>`;
  } else if (cNav === "tasks"){
    h = `<section class="sec"><div class="sec-hd"><span class="sec-lbl">⚡ Tasks</span><div class="acts" style="margin:0"><button class="btn" type="button" id="syncAll">Add all to Calendar</button><button class="btn pri" type="button" id="addBtn">+ Add</button></div></div>${renderTasks()}</section>
       <section class="sec"><div class="sec-hd"><span class="sec-lbl">✍️ Blog tracker</span></div>${renderBlog()}</section>`;
  } else if (cNav === "fitness") h = `<section class="sec">${renderFitness()}</section>`;
  else if (cNav === "pipeline") h = renderPipeline(false);
  else if (cNav === "watch") h = renderWatch();
  else h = renderIntel();
  $("#main").innerHTML = h;
  updateBadge();
}

/* ---------- events ---------- */
$("#main").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.fdone){ const x = fDay(0), i = Number(d.fdone); x.done[i] = !x.done[i]; save(); if (x.done[i] && x.top.filter(Boolean).length && x.done.every((v, j) => v || !x.top[j])) toast("All done. Alhamdulillah, great day."); render(); return; }
  if (d.fchk){ const x = fDay(0); x.chk[d.fchk] = !x.chk[d.fchk]; x.score = fScore(x); save(); render(); return; }
  if (d.fsprint){ F().sprint = { end:Date.now() + Number(d.fsprint) * 6e4 }; save(); render(); fTick(); return; }
  if (d.fstop){ F().sprint = null; save(); render(); return; }
  if (d.fpark){ fPark(); return; }
  if (d.farea){ fArea = d.farea; render(); return; }
  if (d.fmap){ fMap = d.fmap; render(); return; }
  if (d.fq){ const [id, q] = d.fq.split(":"); const x = F().ideas.find(z => z.id === Number(id)); if (x){ x.q = x.q === q ? "" : q; save(); render(); } return; }
  if (d.fidtop){ const x = F().ideas.find(z => z.id === Number(d.fidtop)), t = fDay(0), i = t.top.findIndex(v => !v); if (!x) return; if (i < 0) return toast("Top 3 is full. Finish or clear one first.", false); t.top[i] = x.t; F().ideas = F().ideas.filter(z => z !== x); save(); toast("Moved to Top 3"); render(); window.scrollTo({ top:0 }); return; }
  if (d.fiddel){ F().ideas = F().ideas.filter(z => z.id !== Number(d.fiddel)); save(); render(); return; }
  if (d.fclear){ F().ideas = F().ideas.filter(z => z.q !== "drop"); save(); render(); return; }
  if (d.fgym){ const s = new Set(F().gymDays), i = Number(d.fgym); s.has(i) ? s.delete(i) : s.add(i); F().gymDays = [...s].sort(); save(); render(); return; }
  if (d.fwird){ F().wird = Math.max(1, Math.min(40, F().wird + Number(d.fwird))); save(); render(); return; }
  if (d.fbook){ fBook(b); return; }
  if (d.gofit){ cNav = "fitness"; fitTab = "plan"; document.querySelectorAll(".ni").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.nav === "fitness"))); render(); window.scrollTo({ top:0 }); return; }
  if (d.wdel){ delWatch(Number(d.wdel)); return; }
  if (d.wrec){ getWatchRecs(); return; }
  if (d.toggle) toggleTask(Number(d.toggle));
  else if (d.del) delTask(Number(d.del));
  else if (d.reload) ({ cal:loadCal, deals:loadDeals, mail:loadEmails })[d.reload]();
  else if (d.fit){ fitTab = d.fit; render(); }
  else if (d.pday){ planDay = d.pday; render(); }
  else if (d.pick){ const [si, oi] = d.pick.split(":").map(Number), k = localDay(); S.picks[k] = S.picks[k] || {}; if (S.picks[k][si] === oi) delete S.picks[k][si]; else S.picks[k][si] = oi; const ks = Object.keys(S.picks).sort(); ks.slice(0, Math.max(0, ks.length - 30)).forEach(x => delete S.picks[x]); save(); render(); }
  else if (d.water){ const k = localDay(); S.water[k] = Math.max(0, (S.water[k] || 0) + Number(d.water)); const ks = Object.keys(S.water).sort(); ks.slice(0, Math.max(0, ks.length - 60)).forEach(x => delete S.water[x]); save(); render(); }
  else if (d.set){ const [ei, si] = d.set.split(":").map(Number); saveGymMeta(); const s = todayLog().exercises[ei].sets[si]; s.done = !s.done; save(); render(); }
  else if (d.addset){ saveGymMeta(); const ex = todayLog().exercises[Number(d.addset)], last = ex.sets[ex.sets.length - 1]; ex.sets.push({ w:last ? last.w : 0, r:last ? last.r : 10, done:false }); save(); render(); }
  else if (d.meal){ const m = S.diet[localDay()][Number(d.meal)]; m.done = !m.done; save(); render(); }
  else if (d.blog){ blogTab = d.blog; render(); }
  else if (d.advance){ const x = S.blog.find(p => p.id === Number(d.advance)); if (x){ x.status = BST[Math.min(BST.indexOf(x.status) + 1, 3)]; save(); render(); } }
  else if (d.delblog){ S.blog = S.blog.filter(p => p.id !== Number(d.delblog)); save(); render(); }
  else if (d.intel){ intelTab = d.intel; render(); }
  else if (b.id === "logDone"){ saveGymMeta(); todayLog().saved = true; save(); toast("Workout logged. Great session."); render(); }
  else if (b.id === "syncAll") syncAll(b);
  else if (b.id === "addBtn") openAdd();
});
$("#main").addEventListener("change", e => {
  if (e.target.closest(".gymstats")) return saveGymMeta();
  const d = e.target.dataset || {};
  if (d.ftop != null){ fDay(0).top[Number(d.ftop)] = e.target.value.trim(); save(); }
  else if (d.frv != null){ const i = Number(d.frv), v = e.target.value.trim(); fDay(0).rv[i] = v; if (i === 2 && v){ fDay(1).top[0] = v; toast("Saved as tomorrow's #1"); } save(); }
});
$("#main").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "fIdea"){ e.preventDefault(); fPark(); } else if (e.key === "Enter" && e.target.matches("[data-ftop],[data-frv]")) e.target.blur(); });
$("#main").addEventListener("focusout", () => { if (fPending) setTimeout(() => { if (!(document.activeElement && document.activeElement.matches && document.activeElement.matches("#main input"))) render(); }, 50); });

$("#main").addEventListener("submit", e => { if (e.target.id === "wForm"){ e.preventDefault(); addWatch(); } });

/* ---------- start ---------- */
initState();
use("mcp").then(m => { mcp = m; loadCal(); loadDeals(); loadEmails(); });
setInterval(() => { if (document.visibilityState === "visible" && mcp) loadCal(); }, 10 * 60 * 1000);
</script>
