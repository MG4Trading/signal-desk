<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface-2:#E3E8EE;--ink:#152233;--muted:#5B6B7D;--line:#D3DAE2;
  --accent:#0B7A84;--accent-ink:#FFFFFF;--accent-soft:#D9EEF0;--amber:#B86A00;--amber-soft:#FBEBD2;--up:#1E7A43;--up-soft:#DDF1E4;--down:#B3261E;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1622;--surface:#16212F;--surface-2:#1F2C3C;--ink:#E6ECF2;--muted:#93A3B5;--line:#2A394B;
  --accent:#3FB6BF;--accent-ink:#06212A;--accent-soft:#123540;--amber:#F0A640;--amber-soft:#3A2A12;--up:#5CC98A;--up-soft:#143224;--down:#F2867E;}}
:root[data-theme="dark"]{--bg:#0E1622;--surface:#16212F;--surface-2:#1F2C3C;--ink:#E6ECF2;--muted:#93A3B5;--line:#2A394B;
  --accent:#3FB6BF;--accent-ink:#06212A;--accent-soft:#123540;--amber:#F0A640;--amber-soft:#3A2A12;--up:#5CC98A;--up-soft:#143224;--down:#F2867E;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1}
.brand span{color:var(--accent)}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}
.ring{width:48px;height:48px;flex:0 0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;text-decoration:none;padding:0 12px;font-weight:600}
.grow{flex:1;min-width:0}
main{display:flex;flex-direction:column;gap:14px;padding:14px 0}
.group{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px;background:var(--surface-2)}
.gh strong{font-family:var(--display);font-stretch:85%;font-size:17px}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.pad{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;font-size:16px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#fff;padding:0}
.chk.on{background:var(--up);border-color:var(--up)}
.toprow{display:grid;grid-template-columns:28px 1fr 40px;gap:8px;align-items:center}
.toprow.on .inp{text-decoration:line-through;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12px}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:34px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timer{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:.02em;line-height:1}
.blk{border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.bh{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:12px 16px;width:100%;border:0;background:transparent;text-align:left}
.bh .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bh .tt{font-weight:600;font-size:15px;line-height:1.25}
.bh .ss{font-size:12px;color:var(--muted);margin-top:2px}
.prog{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:999px;padding:3px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.prog.full{background:var(--up-soft);color:var(--up)}
.blk.now{background:var(--accent-soft)}
.blk.now .when{color:var(--accent);font-weight:600}
.blk.past .tt{color:var(--muted)}
.bbody{padding:0 16px 12px 88px;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:6px 0;text-align:left;width:100%;min-height:40px;font-size:14px}
.item.on span:last-child{text-decoration:line-through;color:var(--muted)}
.item .chk{width:24px;height:24px;font-size:12px}
.ev{font-size:13px;color:var(--amber);font-weight:600;padding:3px 0}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.week{display:flex;gap:6px;align-items:flex-end;height:46px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:10px;color:var(--muted);height:100%;font-family:var(--mono)}
.week i{display:block;width:100%;border-radius:4px;background:var(--accent);min-height:3px}
.idea{border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.idea .t{font-weight:600}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;min-height:30px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.map .box{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;background:var(--bg);display:flex;flex-direction:column;gap:4px;min-height:60px}
.map .box div{border-top:1px dashed var(--line);padding-top:4px}
.map .box .label + div{border-top:0}
.co{border-top:1px solid var(--line)}
.co:first-child{border-top:0}
.role{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);text-decoration:none}
.role:first-child{border-top:0}
.new{font-family:var(--mono);font-size:10px;background:var(--amber-soft);color:var(--amber);border-radius:4px;padding:1px 6px;margin-left:6px}
.act{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.act pre{white-space:pre-wrap;font:13px/1.5 var(--body);margin:0;max-height:220px;overflow:auto}
.act.on{opacity:.55}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.fold summary{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0;min-height:36px}
.ar{font-family:"Amiri",serif;direction:rtl;font-size:19px;line-height:1.7}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:50px;position:relative}
nav button span{font-size:21px;line-height:1.1}
nav button[aria-pressed="true"]{color:var(--accent)}
nav .dot{position:absolute;top:2px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,14,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:38px;font-weight:600}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
</style>
</head>
<body>
<header><div class="wrap hrow">
  <div class="ring" id="ring" aria-label="Today's progress"></div>
  <div class="grow"><div class="brand">Fo<span>cus</span></div><div class="sub" id="hsub">Loading…</div></div>
  <a class="icon" href="../" aria-label="Open Signal Desk">📰</a>
  <button class="icon" type="button" id="setBtn" aria-label="Settings">⚙︎</button>
</div></header>
<main class="wrap" id="main"></main>
<nav><div class="wrap">
  <button type="button" data-tab="today" aria-pressed="true"><span>🧭</span>Today</button>
  <button type="button" data-tab="inbox" aria-pressed="false"><span>📥</span>Inbox<i class="dot" id="ideaDot" hidden></i></button>
  <button type="button" data-tab="jobs" aria-pressed="false"><span>🎯</span>Target jobs<i class="dot" id="jobDot" hidden></i></button>
</div></nav>
<div class="sheet" id="sheet" hidden><div id="sheetBody"></div></div>

<script>
/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const pad = n => String(n).padStart(2, "0");
const store = { get(k, d){ try { const v = localStorage.getItem("fz:" + k); return v == null ? d : JSON.parse(v); } catch(_){ return d; } }, set(k, v){ try { localStorage.setItem("fz:" + k, JSON.stringify(v)); } catch(_){} }, del(k){ try { localStorage.removeItem("fz:" + k); } catch(_){} } };
function toast(m){ const t = el("div", "toast", m); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const dkey = (off = 0) => { const d = new Date(Date.now() + off * 864e5); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const hm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; const h = Math.floor(m / 60); return (h % 12 || 12) + ":" + pad(m % 60) + (h >= 12 ? " p.m." : " a.m."); };
const hmS = m => hm(m).replace(" a.m.", "a").replace(" p.m.", "p");
const isoMin = s => { const d = new Date(s); return d.getHours() * 60 + d.getMinutes(); };
function S(){ return Object.assign({ gymDays:[1, 3, 5], wird:4, shortcut:"Focus Reminder", syncShortcut:"Sync to Focus", doneShortcut:"Focus Done", tickIOS:true }, store.get("set", {})); }
function setS(p){ store.set("set", Object.assign(S(), p)); }
function day(off = 0){ return Object.assign({ top:["", "", ""], done:[false, false, false], ref:[], chk:{}, rv:["", "", ""] }, store.get("d:" + dkey(off), {})); }
function saveDay(o, off = 0){ o.score = score(o); store.set("d:" + dkey(off), o); }
(function prune(){ try { const keep = new Date(Date.now() - 70 * 864e5).toISOString().slice(0, 10); Object.keys(localStorage).filter(k => k.startsWith("fz:d:") && k.slice(5) < keep).forEach(k => localStorage.removeItem(k)); } catch(_){} })();

/* ---------- links out: Google Calendar and iPhone Reminders ---------- */
function calLink(title, a, b, details){
  const d = new Date(), f = m => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(Math.floor(m / 60) % 24) + pad(m % 60) + "00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) + "&dates=" + f(a) + "/" + f(b) + "&ctz=America/Toronto&details=" + encodeURIComponent((details || "") + "\n\nFrom Focus");
}
function remLink(title, atMin, off){
  off = off || 0; if (atMin == null){ atMin = Math.ceil((nowMin() + 60) / 15) * 15; }
  if (atMin >= 1440){ atMin -= 1440; off += 1; }
  const when = " | " + dkey(off) + " " + pad(Math.floor(atMin / 60)) + ":" + pad(atMin % 60);
  return "shortcuts://run-shortcut?name=" + encodeURIComponent(S().shortcut) + "&input=text&text=" + encodeURIComponent(title + when);
}
async function copy(t){ try { await navigator.clipboard.writeText(t); toast("Copied"); } catch(_){ toast("Press and hold to copy"); } }

/* ---------- prayer times: Signal Desk first, own calculation as backup ---------- */
function prayCalc(date, lat, lng){
  const R = Math.PI / 180, ds = d => Math.sin(d * R), dc = d => Math.cos(d * R), dt = d => Math.tan(d * R);
  const as = x => Math.asin(x) / R, ac = x => Math.acos(Math.max(-1, Math.min(1, x))) / R, at2 = (y, x) => Math.atan2(y, x) / R, acot = x => Math.atan(1 / x) / R;
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  let Y = date.getFullYear(), M = date.getMonth() + 1; const Dd = date.getDate(); if (M <= 2){ Y -= 1; M += 12; }
  const A = Math.floor(Y / 100), B = 2 - A + Math.floor(A / 4), jd = Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + Dd + B - 1524.5 - lng / 360;
  const tz = -new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12).getTimezoneOffset() / 60;
  const sun = j => { const D = j - 2451545, g = fix(357.529 + .98560028 * D, 360), q = fix(280.459 + .98564736 * D, 360), L = fix(q + 1.915 * ds(g) + .02 * ds(2 * g), 360), e = 23.439 - .00000036 * D; return { decl:as(ds(e) * ds(L)), eqt:q / 15 - fix(at2(dc(e) * ds(L), dc(L)) / 15, 24) }; };
  const mid = t => fix(12 - sun(jd + t).eqt, 24), ang = (a, t, ccw) => { const d = sun(jd + t).decl, T = ac((-ds(a) - ds(d) * ds(lat)) / (dc(d) * dc(lat))) / 15; return mid(t) + (ccw ? -T : T); };
  const asr = t => { const d = sun(jd + t).decl; return ang(-acot(1 + dt(Math.abs(lat - d))), t); };
  const t = { Fajr:ang(15, 5 / 24, true), Sunrise:ang(.833, 6 / 24, true), Dhuhr:mid(.5), Asr:asr(13 / 24), Maghrib:ang(.833, .75), Isha:ang(15, .75) };
  const o = {}; for (const k in t) o[k] = Math.round((t[k] + tz - lng / 15) * 60); return o;
}
let X = null;
function prayer(){
  const d = X && X.prayer && X.prayer.days.find(x => x.date === dkey());
  if (d){ const o = {}; for (const [k, v] of Object.entries(d.times)){ const [h, m] = v.split(":").map(Number); o[k] = h * 60 + m; } return o; }
  return prayCalc(new Date(), 43.4675, -79.6877);
}

/* ---------- private data ---------- */
let P = null, ST = null, lockErr = "";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(blob, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(blob.iv) }, key, b64(blob.ct))));
}
async function loadPrivate(pass){
  pass = pass || store.get("pass", "");
  if (!pass) return false;
  try {
    const r = await fetch("data.enc?t=" + Math.floor(Date.now() / 60000), { cache:"no-store" }); if (!r.ok) throw new Error("none");
    P = await decrypt(await r.json(), pass); store.set("pass", pass); lockErr = ""; return true;
  } catch(e){ if (e && e.message === "none") lockErr = "Private data isn't published yet. Finish setup in Settings."; else { lockErr = "That passcode didn't unlock your data."; } P = null; return false; }
}
async function loadAll(){
  try { const r = await fetch("status.json?t=" + Math.floor(Date.now() / 60000), { cache:"no-store" }); ST = r.ok ? await r.json() : null; } catch(_){ ST = null; }
  try { const r = await fetch("../extras.json?t=" + Math.floor(Date.now() / 600000), { cache:"no-store" }); if (r.ok) X = await r.json(); } catch(_){}
  await loadPrivate();
  render();
}
const calToday = () => ((P && P.cal) || []).filter(e => e.s && e.s.slice(0, 10) === dkey() && !e.t.startsWith("🎯"));

/* ---------- the day: prayer-anchored blocks with built-in anchors ---------- */
const isWeekend = () => [0, 6].includes(new Date().getDay());
function blocks(){
  const t = prayer(), wk = isWeekend(), dow = new Date().getDay(), s = S(), D = day();
  const gymEv = calToday().find(e => /gym|workout|training/i.test(e.t));
  const gym = !!gymEv || wk || s.gymDays.includes(dow);
  const wake = Math.min(300, t.Fajr - 20), bed = Math.max(wake - 450 + 1440, t.Isha + 40);
  const top = i => D.top[i] ? D.top[i] : (wk ? ["Family goal", "Personal goal", "Prep for the week"] : ["Top 1", "Top 2", "Top 3"])[i];
  const g0 = gymEv ? isoMin(gymEv.s) : wk ? 480 : Math.max(t.Fajr + 30, wake + 50);
  const g1 = gymEv ? isoMin(gymEv.e) + 20 : g0 + (gym ? (wk ? 90 : 80) : 30);
  const wird = s.wird + " pages of Quran";
  const L = wk ? [
    { k:"dawn", a:wake, b:g0, t:"🌅 Quiet start + Fajr", s:"No work today. Fajr, adhkar, Quran, breakfast with family", items:[["Fajr","Fajr on time"],["am","Morning adhkar"],["wird",wird],["water1","Two glasses of water"]] },
    { k:"gym", a:g0, b:g1, t:gym ? "🏋️ Gym (opens 8 a.m.), then Meal 1" : "🚶 Long walk or sport, then Meal 1", s:"Train, then a high-protein breakfast", items:[["gym", gym ? "Gym session" : "Walk or sport"],["m1","Meal 1: about 40 g protein"]] },
    { k:"fam", a:g1, b:t.Dhuhr, t:"👨‍👩‍👧 Family & errands", s:top(0), items:[["top0", top(0)]], cal:true },

  const lines = String(text || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean); if (!lines.length) return 0;

  lines.forEach(line => { const [t0, d0, l0] = line.split(/\s*\|\s*/); const t = (t0 || "").trim(); if (!t) return; let due = "";
    if (d0){ const m = d0.match(/(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/); if (m) due = m[1] + "-" + m[2] + "-" + m[3] + (m[4] ? " " + pad(m[4]) + ":" + m[5] : ""); else { const dt = new Date(d0); if (!isNaN(dt)) due = ymd(dt) + (/\d:\d/.test(d0) ? " " + pad(dt.getHours()) + ":" + pad(dt.getMinutes()) : ""); } }
    const key = t.toLowerCase(); seen.add(key);
    const y = L.find(z => z.src === "ios" && z.t.toLowerCase() === key);
    if (y){ y.due = due; y.list = l0 || y.list || ""; if (y.done && !y.doneAt) y.done = false; }
    else { L.unshift({ id:Date.now() + added, t, kind:"rem", src:"ios", due, list:l0 || "", a:"work", u:null, i:null, done:false, added:Date.now() }); added++; } });
  L.forEach(z => { if (z.src === "ios" && !z.done && !seen.has(z.t.toLowerCase())){ z.done = true; z.doneAt = Date.now(); z.gone = true; } });
  saveInbox(L); store.set("syncAt", Date.now()); return added;
}

function render(){
  const ae = document.activeElement; if (ae && ae.matches && ae.matches("#main input:not([type=password])") && ae.value){ pending = true; return; }
  pending = false; _bc = null;
  if (tab === "ideas") tab = "inbox"; document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  header();
  const m = $("#main"); m.textContent = "";
  (tab === "inbox" || tab === "ideas" ? viewInbox() : tab === "jobs" ? viewJobs() : viewToday()).forEach(n => n && m.appendChild(n));
  tick();
}
let pending = false;
document.addEventListener("focusout", () => { if (pending) setTimeout(() => { const a = document.activeElement; if (!(a && a.matches && a.matches("#main input"))) render(); }, 60); });
function tick(){
  const sp = store.get("sprint", null), t = document.getElementById("timer"); if (!sp){ if (t) t.textContent = "--:--"; return; }
  const left = Math.round((sp.end - Date.now()) / 1000);
  if (left <= 0){ store.del("sprint"); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch(_){} toast("Sprint done. 5-minute reset: stand, water, walk or wudu."); render(); return; }
  if (t) t.textContent = pad(Math.floor(left / 60)) + ":" + pad(left % 60);
}
setInterval(tick, 1000);
setInterval(() => { if (document.visibilityState === "visible") render(); }, 60000);
setInterval(() => { if (document.visibilityState === "visible") loadAll(); }, 10 * 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadAll(); });
hashImport(); render(); loadAll();
if (navigator.serviceWorker) navigator.serviceWorker.register("../sw.js", { scope:"../" }).catch(() => {});
</script>
