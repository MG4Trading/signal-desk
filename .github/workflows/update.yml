name: Update Signal Desk
on:
  schedule:
    - cron: "*/30 * * * *"   # backup only: loop.sh keeps things fresh and restarts itself
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
permissions:
  contents: write
  actions: write
concurrency:
  group: signal-desk
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow || true
      - name: Refresh news, weather, markets, homes and events every 10 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SD_INTERVAL: "600"
        run: bash loop.sh
